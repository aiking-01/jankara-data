name: Refresh shop data

on:
  workflow_dispatch:
  schedule:
    # Daily 04:10 JST (previous day 19:10 UTC)
    - cron: '10 19 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: write
  issues: write

concurrency:
  group: jankara-json-refresh
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test parsers
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Update shops
        id: chains
        continue-on-error: true
        run: python scripts/update.py chains

      - name: Update Jankara prices
        id: jankara
        continue-on-error: true
        run: python scripts/update_prices.py

      - name: Update Big Echo prices
        id: bigecho
        continue-on-error: true
        run: python scripts/update_chain_prices.py

      - name: Update Maneki prices
        id: maneki
        continue-on-error: true
        run: python scripts/update_maneki_prices.py

      # 元データを先に積み、最新の main の上で金額への変換、確認、圧縮をしてプッシュする。
      # ocr.yml と同時に動いて main が先に進んでも、dist を作り直して再試行するので結果を失わない
      - name: Publish data
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_changes.py
          # 各取得処理が成功したデータのみ、検証後のmanifest確認日時を更新する。
          confirmed=()
          [[ "${{ steps.chains.outcome }}" == "success" ]] && confirmed+=(chains)
          [[ "${{ steps.jankara.outcome }}" == "success" ]] && confirmed+=(jankara)
          [[ "${{ steps.bigecho.outcome }}" == "success" ]] && confirmed+=(bigecho)
          [[ "${{ steps.maneki.outcome }}" == "success" ]] && confirmed+=(maneki)
          # 追加PRのステップが存在しない間は空値なので対象へ加えない。
          [[ "${{ steps.joyjoy.outcome }}" == "success" ]] && confirmed+=(joyjoy)
          [[ "${{ steps.joysound.outcome }}" == "success" ]] && confirmed+=(joysound)
          [[ "${{ steps.cotedazur.outcome }}" == "success" ]] && confirmed+=(cotedazur)
          export REFRESH_CONFIRMED_DATA="$(IFS=,; echo "${confirmed[*]}")"
          bash scripts/push_data.sh "data: refresh" chains.json source

      - name: Check published manifest freshness and file integrity
        id: freshness
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        run: python scripts/monitor_freshness.py --max-hours 72

      - name: Notify maintainers about refresh failure or recovery
        if: always()
        id: notification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for outcome in "${{ steps.chains.outcome }}" "${{ steps.jankara.outcome }}" \
                         "${{ steps.bigecho.outcome }}" "${{ steps.maneki.outcome }}" \
                         "${{ steps.publish.outcome }}" "${{ steps.freshness.outcome }}"; do
            if [[ "$outcome" != "success" ]]; then failed=1; fi
          done
          # 追加チェーンのPRがマージ済みなら、その取得失敗も通知対象へ含める。
          for outcome in "${{ steps.joyjoy.outcome }}" "${{ steps.joysound.outcome }}" \
                         "${{ steps.cotedazur.outcome }}"; do
            if [[ -n "$outcome" && "$outcome" != "success" ]]; then failed=1; fi
          done
          title='[Data CI] Refresh requires attention'
          current="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title=="[Data CI] Refresh requires attention") | .number' | head -n 1)"
          if [[ "$failed" == 1 ]]; then
            body="$(printf 'Refreshの失敗・配信鮮度の異常を検出しました。\n\n実行ログ: %s\n\n個別ステップの結果と公開manifestを確認してください。古い正常データは残し、検査を無効化しないでください。\n' \
              "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            if [[ -z "$current" ]]; then
              gh issue create --title "$title" --body "$body"
            else
              gh issue comment "$current" --body "$body"
            fi
          elif [[ -n "$current" ]]; then
            gh issue comment "$current" --body "Refreshと配信manifestの正常化を確認しました: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$current" --reason completed
          fi

      - name: Fail run when a step failed
        if: steps.chains.outcome == 'failure' || steps.jankara.outcome == 'failure' || steps.bigecho.outcome == 'failure' || steps.maneki.outcome == 'failure' || steps.joyjoy.outcome == 'failure' || steps.joysound.outcome == 'failure' || steps.cotedazur.outcome == 'failure' || steps.publish.outcome == 'failure' || steps.freshness.outcome == 'failure' || steps.notification.outcome == 'failure'
        run: |
          echo "::error::Refresh/manifest validation or incident notification failed. Published data remains protected."
          exit 1
