name: Refresh shop data

on:
  workflow_dispatch:
  schedule:
    # Daily 04:10 JST (previous day 19:10 UTC)
    - cron: '10 19 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: jankara-json-refresh
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test parsers
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Update shops
        id: chains
        continue-on-error: true
        run: python scripts/update.py chains

      - name: Update Jankara prices
        id: jankara
        continue-on-error: true
        run: python scripts/update_prices.py

      - name: Update Big Echo prices
        id: bigecho
        continue-on-error: true
        run: python scripts/update_chain_prices.py

      - name: Update Maneki prices
        id: maneki
        continue-on-error: true
        run: python scripts/update_maneki_prices.py

      - name: Convert prices to amounts
        run: node scripts/convert.mjs

      - name: Build compressed files
        id: publish
        continue-on-error: true
        run: python scripts/publish.py

      - name: Commit data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_changes.py
          git add chains.json source dist
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail run when a step failed
        if: steps.chains.outcome == 'failure' || steps.jankara.outcome == 'failure' || steps.bigecho.outcome == 'failure' || steps.maneki.outcome == 'failure' || steps.publish.outcome == 'failure'
        run: |
          echo "::error::Some data sources failed; see logs. Existing data was preserved where possible."
          exit 1
