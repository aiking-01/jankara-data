name: Refresh shop data

# コードを変えても巡回はしない（公式サイトへの負荷とプロキシの通信を毎回使わない）。テストは data-safety.yml が走らせ、変更は翌朝の定期実行で使われる
on:
  workflow_dispatch:
    inputs:
      crawl_all:
        description: '全店を取り直す（締め切りまで、古い順に）'
        type: boolean
        default: false
  schedule:
    # Daily 04:10 JST (previous day 19:10 UTC)
    - cron: '10 19 * * *'

permissions:
  contents: write
  issues: write

# 手で動かした実行が、進行中の定期実行を途中で消さない（消すと取得した分が何もコミットされない）
concurrency:
  group: jankara-json-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 取得は CRAWL_DEADLINE（開始から 80 分）で打ち切り、残りの時間で必ず公開まで進む
    timeout-minutes: 110
    env:
      CRAWL_ALL: ${{ inputs.crawl_all && '1' || '' }}
    steps:
      - name: Set crawl deadline
        run: echo "CRAWL_DEADLINE=$(( $(date +%s) + 80 * 60 ))" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          # OCR関連のテストもRefreshで実行するため、data-safety.ymlと同じ依存関係を入れる。
          python -m pip install "pillow>=10,<12" "numpy>=1.26,<3" "pytesseract>=0.3.13,<1"

      - name: Test parsers
        env:
          JANKARA_TESTING: '1'
        run: python -m unittest discover -s tests -p "test_*.py" -v

      # 公式サイトを読む手順だけがプロキシを通す（接続ごとに出口の IP が変わる）。
      # git push と GitHub への通知は通さない。Secrets がないか、プロキシにつながらなければ直接つなぐ
      - name: Configure crawl proxy
        env:
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          PROXY_ENDPOINT: ${{ secrets.PROXY_ENDPOINT }}
        run: |
          python -m pip install -q "requests>=2.32,<3" "PySocks>=1.7,<2"
          python scripts/proxy_env.py

      - name: Update shops
        id: chains
        timeout-minutes: 75
        env:
          HTTP_PROXY: ${{ env.CRAWL_PROXY }}
          HTTPS_PROXY: ${{ env.CRAWL_PROXY }}
        continue-on-error: true
        # 店の一覧は、最後に取り直せてから 6 日たったときと、手で動かしたときだけ取り直す。公式サイトへのリクエストを抑えるため。
        # 曜日で決めると、定期実行の開始が遅れて日付をまたいだ週に抜ける
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || python scripts/seen.py list-due chains 6; then
            python scripts/update.py chains
            python scripts/seen.py list-done chains
          else
            echo "店の一覧は 6 日に 1 回だけ取り直します"
          fi

      - name: Update MegaBig shops and prices
        id: megabig
        timeout-minutes: 75
        env:
          HTTP_PROXY: ${{ env.CRAWL_PROXY }}
          HTTPS_PROXY: ${{ env.CRAWL_PROXY }}
        continue-on-error: true
        run: python scripts/update_megabig.py

      - name: Update Jankara prices
        id: jankara
        # プロキシが遅くても後のチェーンの更新を止めない（ふだんは数分で終わる）
        timeout-minutes: 20
        env:
          HTTP_PROXY: ${{ env.CRAWL_PROXY }}
          HTTPS_PROXY: ${{ env.CRAWL_PROXY }}
        continue-on-error: true
        run: python scripts/update_prices.py

      - name: Update Big Echo prices
        id: bigecho
        timeout-minutes: 75
        env:
          HTTP_PROXY: ${{ env.CRAWL_PROXY }}
          HTTPS_PROXY: ${{ env.CRAWL_PROXY }}
        continue-on-error: true
        run: python scripts/update_chain_prices.py

      - name: Update JOYSOUND prices
        id: joysound
        timeout-minutes: 75
        env:
          HTTP_PROXY: ${{ env.CRAWL_PROXY }}
          HTTPS_PROXY: ${{ env.CRAWL_PROXY }}
        continue-on-error: true
        run: python scripts/update_joysound_prices.py

      - name: Update Maneki prices
        id: maneki
        timeout-minutes: 75
        env:
          HTTP_PROXY: ${{ env.CRAWL_PROXY }}
          HTTPS_PROXY: ${{ env.CRAWL_PROXY }}
        continue-on-error: true
        run: python scripts/update_maneki_prices.py

      - name: Update JoyJoy minimum prices
        id: joyjoy
        timeout-minutes: 75
        env:
          HTTP_PROXY: ${{ env.CRAWL_PROXY }}
          HTTPS_PROXY: ${{ env.CRAWL_PROXY }}
        continue-on-error: true
        run: python scripts/update_joyjoy_prices.py

      - name: Update Cote d'Azur prices
        id: cotedazur
        timeout-minutes: 75
        env:
          HTTP_PROXY: ${{ env.CRAWL_PROXY }}
          HTTPS_PROXY: ${{ env.CRAWL_PROXY }}
        continue-on-error: true
        run: python scripts/update_cotedazur_prices.py

      # 元データを先に積み、最新の main の上で金額への変換、確認、圧縮をしてプッシュする。
      # ocr.yml と同時に動いて main が先に進んでも、dist を作り直して再試行するので結果を失わない
      - name: Publish data
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # 確かめた日時を先に移す。select_changes.py が日時だけの変更を戻すと、確かめたことが分からなくなる
          python scripts/seen.py mark
          python scripts/select_changes.py
          bash scripts/push_data.sh "data: refresh" chains.json source

      - name: Check published manifest freshness and file integrity
        id: freshness
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        run: python scripts/monitor_freshness.py --max-hours 72

      - name: Notify maintainers about refresh failure or recovery
        if: always()
        id: notification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          # 一部の店やチェーンの取得失敗は、公開の検査がその店かチェーンだけを外して吸収する。
          # 長く取れないチェーンは publish.py が 14 日で金額を配るのをやめるので、人の対応は要らない。
          # 通知するのは、公開そのものか配信の確認が失敗したときだけ
          for outcome in "${{ steps.publish.outcome }}" "${{ steps.freshness.outcome }}"; do
            if [[ "$outcome" != "success" ]]; then failed=1; fi
          done
          title='[Data CI] Refresh requires attention'
          current="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title=="[Data CI] Refresh requires attention") | .number' | head -n 1)"
          if [[ "$failed" == 1 ]]; then
            body="$(printf 'Refreshの失敗・配信鮮度の異常を検出しました。\n\n実行ログ: %s\n\n個別ステップの結果と公開manifestを確認してください。古い正常データは残し、検査を無効化しないでください。\n' \
              "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            if [[ -z "$current" ]]; then
              gh issue create --title "$title" --body "$body"
            else
              gh issue comment "$current" --body "$body"
            fi
          elif [[ -n "$current" ]]; then
            gh issue comment "$current" --body "Refreshと配信manifestの正常化を確認しました: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$current" --reason completed
          fi

      - name: Fail run when a step failed
        if: steps.publish.outcome == 'failure' || steps.freshness.outcome == 'failure' || steps.notification.outcome == 'failure'
        run: |
          echo "::error::Publishing or manifest validation failed. Published data remains protected."
          exit 1
