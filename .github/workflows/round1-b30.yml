name: Read ROUND1 B-30 price images

# 未登録時は成功扱いで終了し、未承認・画像変更時は公開を停止する。
on:
  workflow_dispatch:
  schedule:
    - cron: '50 22 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/round1-b30.yml'
      - 'ocr/round1_b30_targets.json'
      - 'ocr/round1_b30_reviewed/**'
      - 'ocr/run_round1_b30.py'
      - 'scripts/extract_round1_b30.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract and publish reviewed B-30 prices
        shell: bash
        run: |
          set -euo pipefail
          targets="$(python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("ocr/round1_b30_targets.json").read_text(encoding="utf-8"))
          if doc.get("schema_version") != 1 or not isinstance(doc.get("shops"), dict):
              raise SystemExit("B-30対象店舗ファイルの形式が不正です")
          print(len(doc["shops"]))
          PY
          )"
          if [[ "$targets" == "0" ]]; then
            echo "::notice::B-30対象店舗が未登録なので更新をスキップします"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python -m pip install "requests>=2.32,<3" "pillow>=10,<12" "numpy>=1.26,<3" "pytesseract>=0.3.13,<1"
          python ocr/run_round1_b30.py --config ocr/round1_b30_targets.json --output source/round1_b30.json --work work/round1_b30
          publish="$(python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("work/round1_b30/status.json").read_text(encoding="utf-8"))
          print(str(state["publish"]).lower())
          PY
          )"
          if [[ "$publish" == "true" ]]; then
            bash scripts/push_data.sh "data: verified B-30 prices" source/round1_b30.json
          else
            echo "::notice::新たに承認済みの料金変更がないため配信は維持します"
          fi

      - name: Upload OCR evidence and review drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round1-b30-review
          path: work/round1_b30/
          retention-days: 14
          if-no-files-found: ignore
