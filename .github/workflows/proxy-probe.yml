name: Proxy probe

# プロキシの方式ごとに、つながるかだけを確かめる。ジョブの成否は API で誰でも読めるので、
# ログを開かずにどの方式が使えるかが分かる。巡回もデータの書き込みもしない。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proxy-probe.yml'
      - 'scripts/proxy_env.py'

permissions:
  contents: read

jobs:
  probe:
    name: probe-${{ matrix.scheme }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        scheme: [http, socks5h]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the proxy
        env:
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          PROXY_ENDPOINT: ${{ secrets.PROXY_ENDPOINT }}
        run: |
          python -m pip install -q "requests>=2.32,<3" "PySocks>=1.7,<2"
          python scripts/proxy_env.py --scheme ${{ matrix.scheme }} --require
