name: Proxy probe

# プロキシにつながるかだけを確かめる。巡回もデータの書き込みもしない。
# ログを開かなくても、API で読める手順ごとの成否でどこまで届いたかが分かるように、確認を手順に分け、
# 前の確認が失敗しても後の確認を続ける。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proxy-probe.yml'
      - 'scripts/proxy_env.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
      PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
      PROXY_ENDPOINT: ${{ secrets.PROXY_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: python -m pip install -q "requests>=2.32,<3" "PySocks>=1.7,<2"

      - name: Secret PROXY_USERNAME is set
        if: always()
        run: test -n "$PROXY_USERNAME"

      - name: Secret PROXY_TOKEN is set
        if: always()
        run: test -n "$PROXY_TOKEN"

      - name: Secret PROXY_ENDPOINT is set
        if: always()
        run: test -n "$PROXY_ENDPOINT"

      # PROXY_ENDPOINT の形を値を出さずに調べる（成功 = その形を含む）
      - name: PROXY_ENDPOINT has a scheme
        if: always()
        run: python -c "import os,sys; sys.exit(0 if '://' in os.environ['PROXY_ENDPOINT'] else 1)"

      - name: PROXY_ENDPOINT has one colon (port)
        if: always()
        run: python -c "import os,sys; sys.exit(0 if os.environ['PROXY_ENDPOINT'].split('://')[-1].count(':') == 1 else 1)"

      - name: PROXY_ENDPOINT has several colons (IPv6)
        if: always()
        run: python -c "import os,sys; sys.exit(0 if os.environ['PROXY_ENDPOINT'].split('://')[-1].count(':') > 1 else 1)"

      - name: PROXY_ENDPOINT has spaces or newlines
        if: always()
        run: python -c "import os,sys; v=os.environ['PROXY_ENDPOINT']; sys.exit(0 if v != v.strip() or ' ' in v.strip() else 1)"

      - name: Port 23900 accepts TCP
        if: always()
        run: python -c "import os,socket,sys; sys.path.insert(0,'scripts'); import proxy_env; socket.create_connection((proxy_env.endpoint_host(os.environ['PROXY_ENDPOINT']).strip('[]'), 23900), timeout=10).close()"

      - name: HTTP proxy works
        if: always()
        run: python scripts/proxy_env.py --scheme http --require

      - name: SOCKS5 proxy works
        if: always()
        run: python scripts/proxy_env.py --scheme socks5h --require
