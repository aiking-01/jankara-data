name: Proxy probe

# プロキシにつながるかだけを確かめる。巡回もデータの書き込みもしない。
# ログを開かなくても、API で読める手順ごとの成否でどこまで届いたかが分かるように、確認を手順に分け、
# 前の確認が失敗しても後の確認を続ける。
# プロキシを確かめたいときに Actions の画面から手で動かす。
# ログインできない環境からは、このファイルを変えて push すると 1 回だけ動く（ほかの変更では動かない）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proxy-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
      PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
      PROXY_ENDPOINT: ${{ secrets.PROXY_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: python -m pip install -q "requests>=2.32,<3" "PySocks>=1.7,<2"

      - name: Secret PROXY_USERNAME is set
        if: always()
        run: test -n "$PROXY_USERNAME"

      - name: Secret PROXY_TOKEN is set
        if: always()
        run: test -n "$PROXY_TOKEN"

      - name: Secret PROXY_ENDPOINT is set
        if: always()
        run: test -n "$PROXY_ENDPOINT"

      # PROXY_ENDPOINT の形を値を出さずに調べる（成功 = その形を含む）
      - name: PROXY_ENDPOINT has a scheme
        if: always()
        run: python -c "import os,sys; sys.exit(0 if '://' in os.environ['PROXY_ENDPOINT'] else 1)"

      - name: PROXY_ENDPOINT has one colon (port)
        if: always()
        run: python -c "import os,sys; sys.exit(0 if os.environ['PROXY_ENDPOINT'].split('://')[-1].count(':') == 1 else 1)"

      - name: PROXY_ENDPOINT has several colons (IPv6)
        if: always()
        run: python -c "import os,sys; sys.exit(0 if os.environ['PROXY_ENDPOINT'].split('://')[-1].count(':') > 1 else 1)"

      - name: PROXY_ENDPOINT has spaces or newlines
        if: always()
        run: python -c "import os,sys; v=os.environ['PROXY_ENDPOINT']; sys.exit(0 if v != v.strip() or ' ' in v.strip() else 1)"

      - name: Host resolves
        if: always()
        run: python -c "import os,socket,sys; sys.path.insert(0,'scripts'); import proxy_env; socket.getaddrinfo(proxy_env.endpoint_host(os.environ['PROXY_ENDPOINT']).strip('[]'), None)"

      # 家庭内や VPN の内部アドレスだと GitHub の実行環境からは届かない
      - name: Host is a public address
        if: always()
        run: python -c "import os,socket,sys,ipaddress; sys.path.insert(0,'scripts'); import proxy_env; h=proxy_env.endpoint_host(os.environ['PROXY_ENDPOINT']).strip('[]'); sys.exit(0 if all(ipaddress.ip_address(a[4][0]).is_global for a in socket.getaddrinfo(h, None)) else 1)"

      # PROXY_ENDPOINT に付いているポート（23900 以外かもしれない）
      - name: Port in PROXY_ENDPOINT is 23900
        if: always()
        run: python -c "import os,sys; from urllib.parse import urlsplit; sys.exit(0 if urlsplit(os.environ['PROXY_ENDPOINT'].strip()).port == 23900 else 1)"

      - name: Port in PROXY_ENDPOINT accepts TCP
        if: always()
        run: python -c "import os,socket; from urllib.parse import urlsplit; u=urlsplit(os.environ['PROXY_ENDPOINT'].strip()); socket.create_connection((u.hostname, u.port), timeout=10).close()"

      - name: PROXY_ENDPOINT has a path
        if: always()
        run: python -c "import os,sys; from urllib.parse import urlsplit; sys.exit(0 if urlsplit(os.environ['PROXY_ENDPOINT'].strip()).path not in ('', '/') else 1)"

      - name: PROXY_ENDPOINT scheme is http
        if: always()
        run: python -c "import os,sys; from urllib.parse import urlsplit; sys.exit(0 if urlsplit(os.environ['PROXY_ENDPOINT'].strip()).scheme == 'http' else 1)"

      - name: PROXY_ENDPOINT scheme is socks
        if: always()
        run: python -c "import os,sys; from urllib.parse import urlsplit; sys.exit(0 if urlsplit(os.environ['PROXY_ENDPOINT'].strip()).scheme.startswith('socks') else 1)"

      - name: Port 23900 accepts TCP
        if: always()
        run: python -c "import os,socket,sys; sys.path.insert(0,'scripts'); import proxy_env; socket.create_connection((proxy_env.endpoint_host(os.environ['PROXY_ENDPOINT']).strip('[]'), 23900), timeout=10).close()"

      - name: HTTP proxy works
        if: always()
        run: python scripts/proxy_env.py --scheme http --require

      - name: SOCKS5 proxy works
        if: always()
        run: python scripts/proxy_env.py --scheme socks5h --require
