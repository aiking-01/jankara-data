name: Validate data safety

on:
  pull_request:
    # JSON SHAのPRは#9へ積み上げるため、依存ブランチでも回帰検証する。
    branches: [main, fix/audit05-data-freshness-20261106]
  # コードを変えたときはテストと検査だけを走らせる（1〜2 分、公式サイトには接続しない）。
  # 巡回と読み取りは refresh.yml と ocr.yml の毎日の定期実行だけで行う
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'ocr/*.py'
      - 'ocr/*.mjs'
      - 'tests/**'
      - 'requirements*.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pillow>=10,<12" "numpy>=1.26,<3" "pytesseract>=0.3.13,<1"
          python -m py_compile scripts/extract_round1_b30.py ocr/run_round1_b30.py

      - name: Python regression tests
        env:
          JANKARA_TESTING: '1'
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Convert current committed sources
        run: node scripts/convert.mjs

      - name: Check converter amounts and OCR
        run: node --test tests/*.test.mjs

      - name: Validate source and published data against main
        run: |
          git fetch origin main
          # 毎朝の公開と同じ修復の基準で確かめる（この CI の中で外した店はどこにもコミットしない）。
          # 修復なしだと、変換を直して配る店が増減しただけで赤くなり、人が判断する手順になる
          python scripts/validate_data.py --stage full --baseline origin/main --repair
