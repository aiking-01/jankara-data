name: Validate data safety

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Python regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Convert current committed sources
        run: node scripts/convert.mjs

      - name: Check converter amounts and OCR
        run: node --test tests/*.test.mjs

      - name: Validate source and published data against main
        run: |
          git fetch origin main
          python scripts/validate_data.py --stage full --baseline origin/main
